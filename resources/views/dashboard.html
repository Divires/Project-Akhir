<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>READIFY</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="dashboard.css" />
</head>
<body>
  <div class="auth-container active" id="register-container">
    <h1 class="brand">READIFY</h1>
    <p class="form-title">Daftar</p>
    <form>
      <div class="form-group">
        <label for="name">Nama</label>
        <input type="text" id="name" placeholder="Masukkan Nama" />
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Masukkan Email" />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-wrapper">
          <input type="password" id="reg-password" placeholder="Masukkan kata sandi" />
        </div>
      </div>
      <button type="submit">Daftar</button>
      <p class="login-text">
        Sudah punya akun?
        <a href="#" onclick="toggleAuth('login')">Masuk</a>
      </p>
    </form>
  </div>

  <div class="auth-container" id="login-container">
    <h1 class="brand">READIFY</h1>
    <p class="form-title">Masuk</p>
    <form>
      <div class="form-group">
        <label for="email-login">Email</label>
        <input type="email" id="email-login" placeholder="Masukkan Email" />
      </div>
      <div class="form-group">
        <label for="password-login">Password</label>
        <div class="password-wrapper">
          <input type="password" id="password-login" placeholder="Masukkan kata sandi" />
        </div>
      </div>
      <button type="submit">Masuk</button>
      <p class="login-text">
        Belum punya akun?
        <a href="#" onclick="toggleAuth('register')">Daftar</a>
      </p>
    </form>
  </div>

  <script>
    function toggleAuth(mode) {
      const register = document.getElementById('register-container');
      const login = document.getElementById('login-container');

      if (mode === 'login') {
        register.classList.remove('active');
        login.classList.add('active');
      } else {
        login.classList.remove('active');
        register.classList.add('active');
      }
    }
  </script>
</body>
</html>
</html>
